<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wuwa-smartkey</title>
    <script>
      // 浏览器调试模式：非 Tauri 环境（如直接开 vite dev 页面）注入 mock 数据，
      // Tauri 窗口内不受任何影响。用于在浏览器中调试 UI 渲染。
      (function () {
        if (window.__TAURI_INTERNALS__) return;
        const chart = {
          id: "mock",
          title: "调试轴（浏览器 mock）",
          character: "A / B / C",
          steps: [],
          periods: [
            { id: "p1", kind: "startup_axis", label: "起手", startMs: 0, endMs: 3000 },
            { id: "p2", kind: "loop_axis", label: "循环", startMs: 3000, endMs: 8000 },
            { id: "p3", kind: "free_fire", label: "自由", startMs: 6000, endMs: 7000 },
          ],
        };
        const mk = (i, moveId, label, slot, start, lane, color, dur, indep) => ({
          id: "s" + i,
          moveId,
          label,
          characterSlot: slot,
          lane: lane || "main",
          independent: !!indep,
          startMin: start,
          startMax: start,
          durationMin: dur || 120,
          durationMax: dur || 120,
          color,
        });
        chart.steps = [
          mk(1, "switch_3", "切人3", 3, 100, "main", "#577590"),
          mk(2, "skill", "技能", 3, 200, "main", "#6c8cff"),
          mk(3, "echo", "声骸", 3, 400, "main", "#b983ff"),
          mk(4, "liberation", "共鸣解放", 3, 600, "main", "#ff6b6b"),
          mk(5, "switch_2", "切人2", 2, 3200, "main", "#4d908e"),
          mk(6, "basic_attack", "普攻", 2, 3300, "main", "#7fd1ae", 120, true),
          mk(7, "basic_attack", "普攻", 2, 3360, "main", "#7fd1ae", 120, true),
          mk(8, "basic_attack", "普攻", 2, 3420, "main", "#7fd1ae", 120, true),
          mk(9, "heavy_attack", "重击", 2, 3600, "main", "#62b6cb", 250),
          mk(10, "skill_hold", "长按技能", 1, 3700, "main", "#8aa2ff", 400),
          mk(11, "switch_1", "切人1", 1, 5000, "main", "#43aa8b"),
          mk(12, "skill", "技能", 1, 5100, "main", "#6c8cff"),
          mk(13, "basic_attack", "自由输出", 1, 6300, "main", "#7fd1ae", 120, true),
          mk(14, "liberation", "共鸣解放", 1, 7400, "main", "#ff6b6b"),
        ];
        const charts = [{ id: "mock", title: "调试轴", character: "A/B/C", tags: [], file: "mock.json" }];
        // Tauri 事件回调调用约定：transformCallback 返回的 id 对应 window._<id>
        window.__TAURI_INTERNALS__ = {
          transformCallback: function (cb) {
            const id = (window.__mockCbId = (window.__mockCbId || 0) + 1);
            window["_" + id] = cb;
            return id;
          },
          invoke: function (cmd, args) {
            if (cmd === "list_charts") return Promise.resolve(charts);
            if (cmd === "get_chart") return Promise.resolve(chart);
            if (cmd === "get_settings")
              return Promise.resolve({ hotkeyStart: "F6", hotkeyStop: "F7", hotkeyRestart: "F8" });
            if (cmd === "start_playback") {
              mockPlayback((args && args.mode) || "full");
              return Promise.resolve(null);
            }
            if (cmd === "stop_playback") {
              clearTimeout(window.__mockPlayTimer);
              return Promise.resolve(null);
            }
            return Promise.resolve(1);
          },
          metadata: {
            currentWindow: { label: "main" },
            currentWebview: { label: "main" },
          },
        };
        // 模拟播放事件流：semi 演示等待切人→段播放→打断；其他模式演示普通播放
        function mockEmit(ev) {
          for (let i = 1; i <= (window.__mockCbId || 0); i++) {
            const cb = window["_" + i];
            if (typeof cb === "function") {
              try { cb({ event: "playback-event", id: i, payload: ev }); } catch (e) { /* ignore */ }
            }
          }
        }
        function mockPlayback(mode) {
          const seq =
            mode === "semi"
              ? [
                  { Started: { title: chart.title } },
                  { WaitingSwitch: { slot: 3, round: 1, index: 1, total: 3, steps: 3, approx_ms: 500 } },
                  { Switch: { from: null, to: 3 } },
                  { StepDone: { label: "技能", planned_ms: 0, actual_ms: 0, held_ms: 40 } },
                  { StepDone: { label: "共鸣解放", planned_ms: 400, actual_ms: 402, held_ms: 40 } },
                  { SegmentDone: { slot: 3, reason: "completed" } },
                  { WaitingSwitch: { slot: 2, round: 1, index: 2, total: 3, steps: 5, approx_ms: 900 } },
                  { Switch: { from: 3, to: 2 } },
                  { StepDone: { label: "普攻", planned_ms: 0, actual_ms: 0, held_ms: 40 } },
                  { SegmentDone: { slot: 2, reason: "switched" } },
                  { KeyIgnored: { got: 4, expected: 1 } },
                  { WaitingSwitch: { slot: 1, round: 1, index: 3, total: 3, steps: 2, approx_ms: 400 } },
                  { Stopped: { reason: "manual" } },
                ]
              : [
                  { Started: { title: chart.title } },
                  { Switch: { from: null, to: 3 } },
                  { StepDone: { label: "技能", planned_ms: 200, actual_ms: 201, held_ms: 40 } },
                  { LoopRound: { round: 1 } },
                  { StepDone: { label: "普攻", planned_ms: 3300, actual_ms: 3305, held_ms: 40 } },
                  { FreeFire: { wait_ms: 1000 } },
                  { Stopped: { reason: "completed" } },
                ];
          let i = 0;
          const step = () => {
            if (i >= seq.length) return;
            mockEmit(seq[i++]);
            window.__mockPlayTimer = setTimeout(step, i === 1 ? 200 : 900);
          };
          step();
        }
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
