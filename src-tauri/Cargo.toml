[package]
name = "wuwa-smartkey"
version = "0.1.0"
description = "鸣潮按键宏工具：轴播放器"
authors = ["alex-1263"]
edition = "2021"

[lib]
# lib 名与 bin 名不同以避免 Windows 上的链接冲突
name = "wuwa_smartkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
engine = { path = "../engine" }
